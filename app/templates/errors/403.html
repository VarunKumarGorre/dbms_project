{% extends "base.html" %}
{% set no_shell = true %}

{% block title %}403 Forbidden{% endblock %}

{% block content %}
<div class="error-page-wrap">
  <div class="error-card">
    <div class="error-code">403</div>
    <h1 class="error-title">Access Forbidden</h1>
    <p class="error-desc">You do not have permission to access this resource or operational data view.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary" style="display: inline-flex; justify-content: center;">
      Back to Dashboard
    </a>
  </div>
</div>
{% endblock %}
