{% extends "base.html" %}
{% set no_shell = true %}

{% block title %}404 Not Found{% endblock %}

{% block content %}
<div class="error-page-wrap">
  <div class="error-card">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">The requested resource, record, or page could not be located in the system.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary" style="display: inline-flex; justify-content: center;">
      Back to Dashboard
    </a>
  </div>
</div>
{% endblock %}
